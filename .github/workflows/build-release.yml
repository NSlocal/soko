name: Build & Release SoKo Browser
on:
  push:
    branches: [ main, master ]
    paths-ignore: [ '**.md', 'LICENSE' ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify Gradle wrapper files
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "⚠️ gradle-wrapper.jar missing — downloading official v8.9.0..."
            curl -L -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v8.9.0/gradle-wrapper/src/main/resources/org/gradle/wrapper/gradle-wrapper.jar
          fi
          ls -la gradle/wrapper/

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" > keystore.jks
          fi
          ./gradlew clean assembleRelease \
            -PkeystoreFile=keystore.jks \
            -PkeystorePassword="$STORE_PASSWORD" \
            -PkeyAlias="$KEY_ALIAS" \
            -PkeyPassword="$KEY_PASSWORD" || true
          ls -la app/build/outputs/apk/release/ || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SoKo-Browser-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v156.0.8078.4
          name: SoKo Browser — Chromium 156.0.8078.4
          body: |
            ✅ Build successful!
            - Chromium: `156.0.8078.4`
            - Build: `807800414`
            - MV3 AdBlock + Secure DNS
            - Android 16 / Global Indonesia
          files: app/build/outputs/apk/release/*.apk
