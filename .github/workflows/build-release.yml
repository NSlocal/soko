name: Build & Release SoKo Browser
on:
  push:
    branches: [ main, master ]
    paths-ignore: [ '**.md', 'LICENSE' ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Auto-fix Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -L -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v8.9.0/gradle-wrapper/src/main/resources/org/gradle/wrapper/gradle-wrapper.jar
          fi
          ls -la gradle/wrapper/

      - name: Make scripts executable
        run: chmod +x gradlew

      - name: Build APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          # Only decode & use keystore if ALL secrets exist
          USE_SIGNING=0
          if [ -n "$SIGNING_KEY" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "$SIGNING_KEY" | tr -d '\n' | base64 -d > keystore.jks && USE_SIGNING=1
          fi

          if [ $USE_SIGNING -eq 1 ]; then
            echo "✅ Building SIGNED APK..."
            ./gradlew clean assembleRelease \
              -PkeystoreFile=keystore.jks \
              -PkeystorePassword="$STORE_PASSWORD" \
              -PkeyAlias="$KEY_ALIAS" \
              -PkeyPassword="$KEY_PASSWORD"
          else
            echo "⚠️ Building UNSIGNED APK — no signing secrets set"
            ./gradlew clean assembleRelease
          fi

          echo "--- Build result ---"
          ls -la app/build/outputs/apk/release/ 2>/dev/null || ls -la app/build/outputs/apk/debug/ 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoKo-Browser-APK
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v156.0.8078.4
          name: SoKo Browser — Chromium 156.0.8078.4
          body: |
            ✅ Build Complete
            - Chromium: `156.0.8078.4`
            - Build: `807800414`
            - MV3 AdBlock + Secure DNS
            - Android 16 / Global Indonesia
            - **Unsigned APK** — ready to install/test
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          overwrite_files: true
