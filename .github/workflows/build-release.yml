name: Build & Release SoKo Browser
on:
  push:
    branches: [ main, master ]
    paths-ignore: [ '**.md', 'LICENSE' ]
  release:
    types: [ published ]
  workflow_dispatch: # Manual run anytime

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" > keystore.jks
          ./gradlew assembleRelease \
            -PkeystoreFile=keystore.jks \
            -PkeystorePassword="$STORE_PASSWORD" \
            -PkeyAlias="$KEY_ALIAS" \
            -PkeyPassword="$KEY_PASSWORD"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoKo-Browser-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.sha }}
          name: SoKo Browser — Latest Release
          body: |
            ✅ **SoKo Browser** — Fully Open Source Chromium-based
            - Package: `com.soko.browser`
            - Target: Android 16 / Global Indonesia 2027
            - Random number bugs fixed · Stability improved
            - Chromium-based with enhanced flags
            - Sideloading supported
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          
